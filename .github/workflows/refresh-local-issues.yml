name: Refresh local issues

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call refresh-local-issues API
        run: |
          http_code=$(curl --show-error --silent \
            -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ieum-volunteer.vercel.app/api/refresh-local-issues")
          cat response.json
          echo
          if [ "$http_code" -ge 400 ]; then
            echo "Request failed with HTTP $http_code"
            exit 1
          fi
